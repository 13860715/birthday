<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- ═══ تم اپ بار مرورگر ═══ -->
<meta name="theme-color" content="#1b0e08">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="گرامافون">
<meta name="msapplication-navbutton-color" content="#1b0e08">
<meta name="msapplication-TileColor" content="#1b0e08">
<meta name="msapplication-TileImage" content="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
<title>گرامافون ✦ تولدت مبارک</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/jsmediatags@3.9.5/dist/jsmediatags.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box; -webkit-tap-highlight-color: transparent}
  html,body{height:100%; overflow:hidden}
  body{
    min-height:100vh; height:100vh; display:flex; flex-direction:row; align-items:center; overflow:hidden;
    font-family:'Vazirmatn',sans-serif; color:#e9d6a7;
    background-color:#1b0e08;
    background-image:
      radial-gradient(1100px 520px at 50% -12%, rgba(240,194,107,.15), transparent 62%),
      radial-gradient(circle at 24px 24px, rgba(232,192,106,.045) 1.3px, transparent 1.7px),
      radial-gradient(circle at 56px 56px, rgba(232,192,106,.03) 1.3px, transparent 1.7px),
      linear-gradient(#28150c, #150a06 55%, #0d0603);
    background-size:auto,64px 64px,64px 64px,auto;
    -webkit-tap-highlight-color: transparent;
  }
  .beam{
    position:fixed; top:-4vh; left:50%; width:min(120vmin,920px); height:110vh;
    transform:translateX(-52%); clip-path:polygon(44% 0,56% 0,88% 100%,12% 100%);
    background:linear-gradient(180deg,rgba(255,222,152,.15),rgba(255,222,152,.04) 52%,transparent 82%);
    filter:blur(10px); z-index:1; pointer-events:none;
    animation:beamFlicker 5.5s ease-in-out infinite;
  }
  .glow{
    position:fixed; left:50%; top:55%; width:84vmin; height:54vmin;
    transform:translate(-50%,-50%);
    background:radial-gradient(closest-side,rgba(240,190,100,.28),transparent 72%);
    opacity:.3; transition:opacity .9s ease; z-index:1; pointer-events:none;
  }
  .playing .glow{opacity:.85; animation:breathe 2.8s ease-in-out infinite}
  .dust{position:fixed; inset:0; z-index:20; pointer-events:none}
  .dust span{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle,rgba(255,226,164,.9),rgba(255,226,164,0) 70%);
    animation:dustFloat var(--t) linear infinite; animation-delay:var(--d);
  }
  body::after{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:30;
    background:radial-gradient(120% 92% at 50% 42%, transparent 55%, rgba(8,4,2,.55) 100%);
  }
  .shelf{
    display:flex; flex-direction:column; align-items:center; gap:.7rem;
    padding:1rem .6rem; align-self:center; position:relative; z-index:5;
    max-height:90vh; overflow-y:auto;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  .shelf::-webkit-scrollbar{display:none}
  .shelf-svg{
    display:block; width:clamp(160px,30vw,430px); height:auto;
    filter:drop-shadow(0 20px 26px rgba(0,0,0,.45));
    touch-action:none;
  }
  .disc{cursor:grab; touch-action:none}
  .disc:hover .disc-face{stroke:rgba(232,192,106,.55)}
  .disc-face{transition:stroke .25s}
  .empty-slot{cursor:pointer !important; touch-action:auto}
  .empty-slot:hover .disc-face{stroke:rgba(232,192,106,.95); stroke-width:2.4}
  .empty-slot:hover .empty-label{fill:#f7e3b6}
  .empty-slot:hover .plus-icon{stroke:#f7e3b6}
  .empty-label,.plus-icon{transition:all .25s}
  body.dragging, body.dragging *{cursor:grabbing !important; user-select:none}
  .ghost{
    position:fixed; z-index:70; width:112px; height:112px; pointer-events:none;
    transform:translate(-50%,-50%) rotate(6deg);
    filter:drop-shadow(0 14px 18px rgba(0,0,0,.5));
  }
  .ghost svg{width:100%; height:100%; display:block}
  main{flex:1; display:grid; place-items:center; position:relative; z-index:2; padding:1rem}
  .gram-wrap{
    position:relative; cursor:pointer; user-select:none; -webkit-user-select:none; outline:none;
    transform: translateY(-20px);
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  .gram-wrap:focus-visible{outline:3px dashed #e8c06a; outline-offset:12px; border-radius:22px}
  #scene{
    display:block; height:min(52vh,470px); max-width:min(56vw,600px); width:auto;
    filter:drop-shadow(0 18px 26px rgba(0,0,0,.45)); transition:filter .4s;
  }
  .gram-wrap:hover #scene{filter:drop-shadow(0 24px 32px rgba(0,0,0,.55)) brightness(1.03)}
  .playing #scene{filter:drop-shadow(0 24px 32px rgba(0,0,0,.55)) brightness(1.05)}
  .notes{position:absolute; inset:0; pointer-events:none; z-index:4}
  .note{
    position:absolute; color:#f4c873; font-size:20px;
    text-shadow:0 0 10px rgba(201,151,63,.6);
    transform:translate(-50%,0); animation:floatNote 2.6s ease-out forwards;
  }
  .drop-highlight{
    opacity:0; transition:opacity .25s ease;
    pointer-events:none;
  }
  body.dragging .drop-highlight{
    opacity:1;
    animation:pulseBorder 1.4s ease-in-out infinite;
  }
  .trash-bin{
    position:fixed; bottom:-80px; left:50%;
    transform:translateX(-50%);
    z-index:60;
    font-size:2.8rem;
    line-height:1;
    transition:bottom .4s cubic-bezier(.55,-.12,.3,1.14), font-size .25s ease;
    pointer-events:none;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.55));
  }
  body.dragging .trash-bin{bottom:2rem}
  .trash-bin.trash-hover{font-size:3.6rem}
  .hint-card{
    position:fixed; bottom:1.2rem; right:1.4rem; z-index:40;
    display:flex; align-items:center; gap:.6rem;
    background:rgba(0,0,0,.4); border:1px dashed rgba(201,151,63,.5);
    border-radius:10px; padding:.5rem .9rem; font-size:.75rem; color:#dcc28a;
    line-height:1.7; max-width:46vw;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:#e8c06a;flex-shrink:0;animation:pulseDot 1.8s infinite}
  .arm{
    transform-box:view-box; transform-origin:645px 300px;
    transform:rotate(-34deg);
    transition:transform 1s cubic-bezier(.55,-.12,.3,1.14);
  }
  .playing .arm{transform:rotate(0deg)}
  .armInner{transform-box:view-box; transform-origin:645px 300px}
  .playing .armInner{animation:wiggle 1.5s ease-in-out infinite}
  .needle-shadow{opacity:0; transition:opacity .7s ease .4s}
  .playing .needle-shadow{opacity:.4}
  @keyframes wiggle{0%,100%{transform:rotate(0)}50%{transform:rotate(-1.1deg)}}
  @keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(232,192,106,.5)}60%{box-shadow:0 0 0 7px rgba(232,192,106,0)}}
  @keyframes beamFlicker{0%,100%{opacity:.85}18%{opacity:1}42%{opacity:.78}60%{opacity:.95}80%{opacity:.82}}
  @keyframes breathe{from{opacity:.65}to{opacity:.9}}
  @keyframes floatNote{
    0%{opacity:0; transform:translate(-50%,0) scale(.55) rotate(0)}
    14%{opacity:1}
    100%{opacity:0; transform:translate(calc(-50% + var(--dx)),-150px) scale(1.2) rotate(var(--rot))}
  }
  @keyframes dustFloat{
    0%{transform:translate(0,0); opacity:0}
    12%{opacity:var(--o)} 85%{opacity:var(--o)}
    100%{transform:translate(var(--dx),-48vh); opacity:0}
  }
  @keyframes pulseBorder{
    0%,100%{stroke-width:4; opacity:1}
    50%{stroke-width:7; opacity:.65}
  }
  .letter-icon{
    position:fixed; top:1.2rem; right:1.4rem; font-size:3.2rem;
    transform:rotate(-15deg); cursor:pointer; z-index:55;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.5));
    transition:transform .3s ease; user-select:none;
    line-height:1;
  }
  .letter-icon:hover{transform:rotate(-15deg) scale(1.15)}
  .letter-icon:active{transform:rotate(-15deg) scale(.95)}
  .letter-icon .badge{
    position:absolute; top:-4px; right:-4px;
    background:#c9973f; color:#2a1808;
    font-size:.6rem; font-weight:700;
    min-width:16px; height:16px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    transform:rotate(15deg); box-shadow:0 2px 5px rgba(0,0,0,.4);
    opacity:0; transition:opacity .3s;
    font-family:'Vazirmatn';
  }
  .letter-icon.has-unread .badge{opacity:1}
  .letter-overlay{
    position:fixed; inset:0; z-index:200;
    background:rgba(8,4,2,.82); backdrop-filter:blur(8px);
    display:none; align-items:center; justify-content:center;
    padding:1.5rem; animation:fadeIn .3s;
  }
  .letter-overlay.open{display:flex}
  .letter-envelope{
    background:linear-gradient(135deg,#f4e4c1,#e8d4a8 50%,#d9bd82);
    color:#3a2413; padding:2.5rem 2rem; border-radius:8px;
    max-width:90vw; width:460px; max-height:82vh; overflow-y:auto;
    font-family:'Vazirmatn'; font-size:1.05rem; line-height:2;
    text-align:right; position:relative;
    box-shadow:0 25px 70px rgba(0,0,0,.6), inset 0 0 0 1px rgba(107,74,38,.3);
    animation:letterOpen .55s cubic-bezier(.55,-.12,.3,1.14);
    transform-origin:center;
  }
  .letter-envelope::before{
    content:''; position:absolute; top:0; left:0; right:0; height:30px;
    background:linear-gradient(180deg,rgba(139,94,43,.18),transparent);
    border-radius:8px 8px 0 0; pointer-events:none;
  }
  .letter-close{
    position:absolute; top:.7rem; left:1rem;
    background:rgba(58,36,19,.1); border:1px solid rgba(58,36,19,.3);
    color:#3a2413; width:32px; height:32px; border-radius:50%;
    cursor:pointer; font-size:1.1rem; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    transition:all .25s;
  }
  .letter-close:hover{background:rgba(58,36,19,.25); transform:scale(1.1)}
  .letter-title{
    font-size:1.4rem; font-weight:700; color:#5a2e13;
    margin-bottom:1.2rem; text-align:center;
    border-bottom:2px dashed rgba(90,46,19,.3); padding-bottom:.8rem;
  }
  .letter-text{font-size:1.05rem; color:#3a2413}
  .letter-sign{
    margin-top:1.5rem; text-align:left; font-style:italic;
    color:#5a2e13; font-weight:600;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes letterOpen{
    0%{transform:scale(.2) rotate(-15deg); opacity:0}
    60%{transform:scale(1.05) rotate(2deg)}
    100%{transform:scale(1) rotate(0); opacity:1}
  }
  @media (max-width:900px){
    body{flex-direction:column; justify-content:center; padding:.8rem .4rem .6rem; gap:.3rem; height:100dvh}
    main{padding:0; order:1; align-self:center; justify-self:center; width:100%; flex:0 0 auto; margin:0 auto}
    #scene{height:auto; width:min(82vw,370px); max-width:none}
    .gram-wrap{transform:translateY(-10px)}
    .shelf{padding:.3rem .2rem; gap:.3rem; order:2; width:100%; max-height:40vh; flex-shrink:1; overflow-y:auto; scrollbar-width:none}
    .shelf::-webkit-scrollbar{display:none}
    .shelf-svg{width:min(94vw,440px)}
    .hint-card{font-size:.6rem; bottom:.5rem; right:.5rem; padding:.3rem .5rem; gap:.3rem; line-height:1.5; max-width:60vw}
    .letter-icon{font-size:2.4rem; top:.8rem; right:.8rem}
    .letter-envelope{padding:1.8rem 1.2rem; font-size:.98rem}
    .letter-title{font-size:1.15rem}
    body.dragging .trash-bin{bottom:1.2rem}
  }
  @media (max-width:480px){
    #scene{width:min(88vw,340px)}
    .shelf-svg{width:96vw}
  }
  @media (prefers-reduced-motion:reduce){
    .beam,.dust span,.note{animation:none!important}
  }
</style>
</head>
<body>
  <div class="beam"></div>
  <div class="glow"></div>
  <div class="dust" id="dust"></div>

  <div class="letter-icon has-unread" id="letterIcon" role="button" tabindex="0" aria-label="نامه">
    ✉️
    <span class="badge">۱</span>
  </div>

  <div class="letter-overlay" id="letterOverlay">
    <div class="letter-envelope">
      <button class="letter-close" id="letterClose" aria-label="بستن">×</button>
      <div class="letter-title" id="letterTitle">تولدت مبارک!</div>
      <div class="letter-text" id="letterText"></div>
      <div class="letter-sign" id="letterSign"></div>
    </div>
  </div>

  <main>
    <figure class="gram-wrap" id="gram" role="button" tabindex="0" aria-pressed="false"
            aria-label="گرامافون — برای نواختن کلیک کنید">
      <svg id="scene" viewBox="0 0 900 670" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="woodTop" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8f5f30"/><stop offset=".6" stop-color="#754722"/><stop offset="1" stop-color="#5d3418"/>
          </linearGradient>
          <linearGradient id="woodFront" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5a3418"/><stop offset="1" stop-color="#371f0d"/>
          </linearGradient>
          <linearGradient id="woodTable" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#4c2e17"/><stop offset="1" stop-color="#211108"/>
          </linearGradient>
          <linearGradient id="woodTableTop" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6b4523"/><stop offset="1" stop-color="#533218"/>
          </linearGradient>
          <linearGradient id="legWood" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#1c0d04"/>
            <stop offset=".3" stop-color="#54341c"/>
            <stop offset=".55" stop-color="#6b4523"/>
            <stop offset=".8" stop-color="#3a2210"/>
            <stop offset="1" stop-color="#150a04"/>
          </linearGradient>
          <linearGradient id="brassLin" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f2dcab"/><stop offset=".55" stop-color="#c9973f"/><stop offset="1" stop-color="#8a6226"/>
          </linearGradient>
          <radialGradient id="brassRad" cx=".35" cy=".3" r="1">
            <stop offset="0" stop-color="#f7e6b8"/><stop offset=".6" stop-color="#c9973f"/><stop offset="1" stop-color="#7a5a24"/>
          </radialGradient>
          <radialGradient id="vinyl" cx=".38" cy=".34" r="1">
            <stop offset="0" stop-color="#3b3b41"/><stop offset=".45" stop-color="#17171b"/><stop offset="1" stop-color="#0a0a0d"/>
          </radialGradient>
          <radialGradient id="labelGrad" cx=".4" cy=".35" r="1">
            <stop offset="0" stop-color="#b8453e"/><stop offset="1" stop-color="#75241e"/>
          </radialGradient>
          <radialGradient id="shadowGrad" cx=".5" cy=".5" r=".5">
            <stop offset="0" stop-color="rgba(0,0,0,.5)"/><stop offset="1" stop-color="rgba(0,0,0,0)"/>
          </radialGradient>
          <path id="labelArc" d="M -34 0 a 34 34 0 1 1 68 0 a 34 34 0 1 1 -68 0"/>
        </defs>

        <ellipse cx="135" cy="668" rx="16" ry="2.5" fill="rgba(0,0,0,.4)"/>
        <path d="M 163 574 L 191 574 L 153 666 L 133 666 Z" fill="url(#legWood)" stroke="#150a04" stroke-width="1.2" stroke-linejoin="round"/>
        <line x1="173" y1="578" x2="139" y2="662" stroke="rgba(0,0,0,.25)" stroke-width="1"/>
        <line x1="183" y1="578" x2="149" y2="662" stroke="rgba(255,220,160,.08)" stroke-width="1"/>

        <ellipse cx="765" cy="668" rx="16" ry="2.5" fill="rgba(0,0,0,.4)"/>
        <path d="M 709 574 L 737 574 L 767 666 L 747 666 Z" fill="url(#legWood)" stroke="#150a04" stroke-width="1.2" stroke-linejoin="round"/>
        <line x1="727" y1="578" x2="761" y2="662" stroke="rgba(0,0,0,.25)" stroke-width="1"/>
        <line x1="717" y1="578" x2="751" y2="662" stroke="rgba(255,220,160,.08)" stroke-width="1"/>

        <rect x="45" y="574" width="810" height="22" fill="url(#woodTable)"/>
        <line x1="45" y1="574" x2="855" y2="574" stroke="#180c05" stroke-width="3"/>

        <rect x="45" y="548" width="810" height="30" fill="url(#woodTableTop)"/>
        <line x1="45" y1="548" x2="855" y2="548" stroke="rgba(255,214,140,.12)" stroke-width="1"/>
        <ellipse cx="450" cy="560" rx="315" ry="15" fill="rgba(255,214,140,.07)"/>

        <g transform="translate(0,-35)">
          <ellipse cx="450" cy="588" rx="318" ry="22" fill="url(#shadowGrad)"/>

          <rect x="170" y="250" width="560" height="222" rx="26" fill="url(#woodTop)" stroke="#2c190c" stroke-width="2"/>
          <path d="M190 300 q 130 9 255 4 t 245 6" fill="none" stroke="rgba(56,30,12,.4)" stroke-width="2"/>
          <path d="M195 424 q 140 -8 260 -3 t 235 -4" fill="none" stroke="rgba(56,30,12,.35)" stroke-width="2"/>
          <rect x="186" y="264" width="528" height="194" rx="18" fill="none" stroke="rgba(232,192,106,.35)" stroke-width="1.5"/>
          <circle cx="198" cy="276" r="3" fill="rgba(232,192,106,.5)"/><circle cx="702" cy="276" r="3" fill="rgba(232,192,106,.5)"/>
          <circle cx="198" cy="446" r="3" fill="rgba(232,192,106,.5)"/><circle cx="702" cy="446" r="3" fill="rgba(232,192,106,.5)"/>
          <rect x="170" y="464" width="560" height="10" fill="rgba(0,0,0,.28)"/>
          <rect x="170" y="470" width="560" height="116" rx="14" fill="url(#woodFront)" stroke="#1e0f06" stroke-width="2"/>
          <line x1="180" y1="480" x2="720" y2="480" stroke="rgba(201,151,63,.25)" stroke-width="2"/>
          <line x1="180" y1="576" x2="720" y2="576" stroke="rgba(201,151,63,.25)" stroke-width="2"/>
          <rect x="192" y="584" width="28" height="9" rx="3" fill="#241308"/>
          <rect x="680" y="584" width="28" height="9" rx="3" fill="#241308"/>
          <g transform="translate(450,528)">
            <rect x="-102" y="-27" width="204" height="54" rx="9" fill="url(#brassLin)" stroke="#6b4a26" stroke-width="2"/>
            <rect x="-95" y="-20" width="190" height="40" rx="6" fill="none" stroke="rgba(0,0,0,.22)"/>
            <text y="10" text-anchor="middle" font-size="26" fill="#4a2c10" font-family="Vazirmatn" font-weight="700">تولدت مبارک ✦</text>
          </g>

          <g transform="translate(390,360) scale(1,.585)">
            <circle class="drop-highlight" r="190" fill="none" stroke="#e8c06a" stroke-width="4" stroke-dasharray="10 8"/>
            <circle r="184" fill="#241409" stroke="rgba(201,151,63,.4)" stroke-width="3"/>
            <circle r="175" fill="#1b100a"/>
            <g id="spin">
              <circle r="166" fill="url(#vinyl)"/>
              <g id="grooves"></g>
              <path id="sheen" d="M 118 -21 A 120 120 0 0 1 77 92" stroke="rgba(255,255,255,.07)" stroke-width="46" fill="none"/>
              <use href="#sheen" transform="rotate(180)"/>
              <circle r="52" fill="url(#labelGrad)" stroke="#571712" stroke-width="2"/>
              <circle r="44" fill="none" stroke="rgba(244,220,171,.3)" stroke-width="1"/>
              <text font-size="11" fill="#f4dcab" text-anchor="middle" font-family="Vazirmatn">
                <textPath href="#labelArc" startOffset="25%">✦ ۷۸ دور ✦ ضبطِ تهران ✦</textPath>
              </text>
              <text id="platterTitle" text-anchor="middle" font-size="12.5" fill="#f7e3b6" font-family="Vazirmatn" font-weight="700">
                <tspan x="0" y="-2">هر جا که</tspan><tspan x="0" y="13">باشی</tspan>
              </text>
              <circle r="7" fill="url(#brassRad)" stroke="#6b4a26" stroke-width="1.5"/>
              <circle r="2.2" fill="#241409"/>
            </g>
          </g>

          <circle cx="516" cy="461" r="4.5" fill="url(#brassRad)" stroke="#6b4a26" stroke-width="1.5"/>

          <g class="arm"><g class="armInner">
            <ellipse class="needle-shadow" cx="447" cy="367" rx="11" ry="3.2" fill="#000"/>
            <circle cx="668" cy="293" r="9" fill="#3a2113" stroke="rgba(201,151,63,.5)" stroke-width="1.5"/>
            <path d="M645 300 C 592 302, 520 320, 472 342" fill="none" stroke="#2c190c" stroke-width="11.5" stroke-linecap="round"/>

function generateRandomMelody() {
  var notes = [];
  var scale = [60, 62, 64, 65, 67, 69, 71, 72];
  var numNotes = 18 + Math.floor(Math.random() * 14);
  var currentIdx = 0;
  
  for (var i = 0; i < numNotes; i++) {
    if (Math.random() < 0.1) {
      notes.push([null, 1]);
      continue;
    }
    
    var r = Math.random();
    var step;
    if (r < 0.35) step = 1;
    else if (r < 0.6) step = -1;
    else if (r < 0.75) step = 2;
    else if (r < 0.85) step = -2;
    else if (r < 0.92) step = 3;
    else step = Math.floor(Math.random() * 5) - 2;
    
    currentIdx = Math.max(0, Math.min(scale.length - 1, currentIdx + step));
    var note = scale[currentIdx];
    
    var dur;
    var dr = Math.random();
    if (dr < 0.25) dur = 0.5;
    else if (dr < 0.6) dur = 1;
    else if (dr < 0.8) dur = 1.5;
    else if (dr < 0.92) dur = 2;
    else dur = 2.5;
    
    notes.push([note, dur]);
  }
  
  notes.push([60, 3]);
  return notes;
}

var DB = {
  db: null,
  init: function() {
    return new Promise(function(resolve) {
      if (!('indexedDB' in window)) { resolve(); return; }
      try {
        var req = indexedDB.open('gramophone_db', 1);
        req.onupgradeneeded = function(e) {
          var db = e.target.result;
          if (!db.objectStoreNames.contains('tracks')) {
            db.createObjectStore('tracks', {keyPath: 'id', autoIncrement: true});
          }
        };
        req.onsuccess = function(e) { DB.db = e.target.result; resolve(); };
        req.onerror = function() { resolve(); };
      } catch(e) { resolve(); }
    });
  },
  save: function(data) {
    return new Promise(function(resolve) {
      if (!DB.db) { resolve(-1); return; }
      try {
        var tx = DB.db.transaction('tracks', 'readwrite');
        var store = tx.objectStore('tracks');
        var req = store.add(data);
        req.onsuccess = function(e) { resolve(e.target.result); };
        req.onerror = function() { resolve(-1); };
      } catch(e) { resolve(-1); }
    });
  },
  getAll: function() {
    return new Promise(function(resolve) {
      if (!DB.db) { resolve([]); return; }
      try {
        var tx = DB.db.transaction('tracks', 'readonly');
        var store = tx.objectStore('tracks');
        var req = store.getAll();
        req.onsuccess = function(e) { resolve(e.target.result || []); };
        req.onerror = function() { resolve([]); };
      } catch(e) { resolve([]); }
    });
  },
  remove: function(id) {
    return new Promise(function(resolve) {
      if (!DB.db) { resolve(false); return; }
      try {
        var tx = DB.db.transaction('tracks', 'readwrite');
        var store = tx.objectStore('tracks');
        var req = store.delete(id);
        req.onsuccess = function() { resolve(true); };
        req.onerror = function() { resolve(false); };
      } catch(e) { resolve(false); }
    });
  }
};

function splitName(name){
  if(name.length<=9) return [name,''];
  var half=Math.ceil(name.length/2);
  var cut=-1;
  for(var i=Math.min(half+4,name.length-1); i>=Math.max(2,half-4); i--)
    if(name[i]===' '){ cut=i; break; }
  var a,b;
  if(cut>0){ a=name.slice(0,cut); b=name.slice(cut+1); }
  else { a=name.slice(0,half); b=name.slice(half); }
  var trim=function(s){return s.length>9? s.slice(0,8)+'…':s;};
  return [trim(a.trim()),trim(b.trim())];
}

function renderShelf(){
  // ═══ همیشه دقیقاً ۲ ردیف × ۴ دیسک = ۸ جای دیسک ═══
  var rows = 2;
  var visibleSlots = 8;

  // اطمینان از وجود حداقل ۸ اسلات
  while (S.slots.length < visibleSlots) S.slots.push(null);

  var lastFloor = floorY(rows-1);
  var bottomY = lastFloor + 11;
  var H = bottomY + 22;

  var s = SHELF_DEFS;
  s += '<ellipse cx="'+(SH.W/2)+'" cy="'+(bottomY+15)+'" rx="'+(SH.W/2-16)+'" ry="7" fill="rgba(0,0,0,.35)"/>';
  s += '<rect x="25" y="28" width="'+(SH.W-50)+'" height="'+(bottomY-28)+'" fill="#241309" opacity=".55"/>';
  s += '<rect x="12" y="16" width="'+(SH.W-24)+'" height="12" fill="url(#sWoodL)" stroke="#241308" stroke-width="1.5"/>';
  s += '<rect x="25" y="28" width="'+(SH.W-50)+'" height="5" fill="rgba(0,0,0,.28)"/>';
  var sideH = bottomY + 12 - 16;
  s += '<rect x="12" y="16" width="13" height="'+sideH+'" fill="url(#sWood)" stroke="#241308" stroke-width="1.5"/>';
  s += '<rect x="'+(SH.W-25)+'" y="16" width="13" height="'+sideH+'" fill="url(#sWood)" stroke="#241308" stroke-width="1.5"/>';

  for(var r=0;r<rows;r++){
    var f = floorY(r);
    s += '<rect x="25" y="'+f+'" width="'+(SH.W-50)+'" height="11" fill="url(#sWoodL)" stroke="#241308" stroke-width="1.5"/>';
    s += '<rect x="25" y="'+(f+11)+'" width="'+(SH.W-50)+'" height="5" fill="rgba(0,0,0,.28)"/>';
  }
  s += '<rect x="12" y="'+bottomY+'" width="'+(SH.W-24)+'" height="12" fill="url(#sWoodL)" stroke="#241308" stroke-width="1.5"/>';

  // فقط ۸ اسلات اول نمایش داده می‌شن
  for(var i=0; i<visibleSlots; i++){
    var t = S.slots[i];
    var p = posOf(i);
    s += '<path d="M '+(p.x-34)+' '+(p.f-2)+' l12 -14 h7 l-8 14 z" fill="#3a2113"/>';
    s += '<path d="M '+(p.x+34)+' '+(p.f-2)+' l-12 -14 h-7 l8 14 z" fill="#3a2113"/>';
    if(t==null)
      s += emptySlotMarkup(p.x, p.y, i);
    else
      s += discMarkup(p.x, p.y, t, i);
  }

  shelfSvg.setAttribute('viewBox', '0 0 '+SH.W+' '+H);
  shelfSvg.innerHTML = s;

  var tr = TRACKS[S.platter];
  if (tr) {
    var lines = tr.lines;
    var tp = platterTitle.querySelectorAll('tspan');
    if(lines[1]){
      tp[0].setAttribute('y',-2); tp[0].textContent = lines[0];
      tp[1].setAttribute('y',13); tp[1].textContent = lines[1];
    }else{
      tp[0].setAttribute('y',6); tp[0].textContent = lines[0];
      tp[1].textContent = '';
    }
  }
}

var drag=null, ghost=null, pendingSlot=null;
function moveGhost(x,y){ if(ghost){ ghost.style.left=x+'px'; ghost.style.top=y+'px'; } }
function killGhost(){ if(ghost){ ghost.remove(); ghost=null; } }
function makeGhost(g,x,y){
  ghost=document.createElement('div'); ghost.className='ghost';
  var svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','-56 -56 112 112');

  var tt=clone.querySelector('title'); if(tt) tt.remove();
  svg.appendChild(clone);
  ghost.appendChild(svg);
  document.body.appendChild(ghost);

}
function overPlatter(x,y){
  var r=scene.getBoundingClientRect();
  var px=r.left + r.width*(390/900);
  var py=r.top + r.height*(360/670);
  var scale=r.width/900;
  return Math.hypot(x-px,y-py) < 200*scale;
}
function overTrash(x,y){
  var r = trashBin.getBoundingClientRect();
  return x >= r.left - 15 && x <= r.right + 15 && y >= r.top - 15 && y <= r.bottom + 15;
}

shelfSvg.addEventListener('click', function(e) {

shelfSvg.addEventListener('pointerdown',function(e){
  var g=e.target.closest('.disc'); if(!g) return;
  if (g.classList.contains('empty-slot')) return;
  var slot=+g.dataset.slot, t=S.slots[slot];

  drag={slot:slot,track:t,el:g};

  document.body.classList.add('dragging');
});
window.addEventListener('pointermove',function(e){ 
  if(drag&&ghost) moveGhost(e.clientX,e.clientY);
  if (drag) {
    if (overTrash(e.clientX, e.clientY)) {
      trashBin.classList.add('trash-hover');
    } else {
      trashBin.classList.remove('trash-hover');
    }
  }
}, {passive:true});
async function endDrag(e,cancelled){
  if(!drag) return;
  var dropOnPlatter = !cancelled && overPlatter(e.clientX,e.clientY);
  var dropOnTrash = !cancelled && overTrash(e.clientX,e.clientY);
  drag.el.style.opacity='';
  killGhost();
  document.body.classList.remove('dragging');
  trashBin.classList.remove('trash-hover');

  if (dropOnPlatter) {
    var old=S.platter, nullIdx=S.slots.indexOf(null);
    S.slots[drag.slot]=null;
    S.slots[nullIdx]=old;
    S.platter=drag.track;
    renderShelf();
    AudioSys.swapTo();
  } else if (dropOnTrash) {
    var tr = TRACKS[drag.track];
    S.slots[drag.slot] = null;
    if (S.platter === drag.track) {
      var firstAvail = S.slots.findIndex(function(s) { return s !== null; });
      S.platter = firstAvail !== -1 ? S.slots[firstAvail] : 1;
      if (S.playing) AudioSys.swapTo();
    }
    if (tr && tr.dbId) {
      await DB.remove(tr.dbId);
    }
    renderShelf();
  }
  drag=null;
}
window.addEventListener('pointerup',function(e){endDrag(e,false);});
window.addEventListener('pointercancel',function(e){endDrag(e,true);});

document.addEventListener('touchmove', function(e) {
  if (drag) e.preventDefault();
}, {passive:false});

function getSongName(file){
  return new Promise(function(resolve) {
    var fallbackName = (file.name.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim()) || 'بی‌نام';
    if (typeof jsmediatags === 'undefined') {
      resolve(fallbackName);
      return;
    }
    try {
      jsmediatags.read(file, {
        onSuccess: function(tag) {
          var title = tag.tags.title;
          var artist = tag.tags.artist;
          if (title) {
            resolve(artist ? title+' — '+artist : title);
          } else {
            resolve(fallbackName);
          }
        },
        onError: function() { resolve(fallbackName); }
      });
    } catch (e) {
      resolve(fallbackName);
    }
  });
}

fileIn.addEventListener('change',async function(){
  var f=fileIn.files[0]; fileIn.value='';
  if(!f) { pendingSlot = null; return; }
  try{
    AudioSys.ensure();
    var name = await getSongName(f);
    var arrayBuffer = await f.arrayBuffer();
    var buf;
    try {
      buf = await AudioSys.ctx.decodeAudioData(arrayBuffer.slice(0));
    } catch(e) {
      alert('فرمت فایل صوتی پشتیبانی نمی‌شود.');
      pendingSlot = null;
      return;
    }
    
    var dbId = await DB.save({name: name, lines: splitName(name), buffer: arrayBuffer});
    
    var trackIdx = TRACKS.length;
    TRACKS.push({type:'audio', name:name, lines:splitName(name), buffer:buf, dbId:dbId});

    var slotIdx;
    if (pendingSlot !== null && pendingSlot < 8 && S.slots[pendingSlot] === null) {
      slotIdx = pendingSlot;
    } else {
      // فقط در ۸ اسلات اول دنبال خالی بگرد
      slotIdx = -1;
      for (var i = 0; i < 8 && i < S.slots.length; i++) {
        if (S.slots[i] === null) { slotIdx = i; break; }
      }
      if (slotIdx === -1) {
        alert('قفسه پر است! لطفاً ابتدا یک دیسک را حذف کنید.');
        pendingSlot = null;
        return;
      }
    }
    S.slots[slotIdx] = trackIdx;
    pendingSlot = null;
    renderShelf();
  }catch(err){
    pendingSlot = null;
    alert('خواندن فایل صوتی ممکن نشد.');
  }
});

var last=performance.now();
(function tick(t){
  var dt=Math.min((t-last)/16.667,3); last=t;
  S.speed += (S.target-S.speed)*0.035*dt;
  if(S.target===0 && Math.abs(S.speed)<0.003) S.speed=0;
  S.angle += S.speed*dt;
  spin.setAttribute('transform','rotate('+(S.angle%360)+')');
  S.crank = (S.crank + S.speed*0.5*dt)%360;
  crankG.setAttribute('transform','rotate('+S.crank+' 766 522)');
  requestAnimationFrame(tick);
})(last);

var AudioSys = {
  ctx:null, tGain:null, srcNode:null, timer:null, ni:0, next:0,
  ensure:function(){
    if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    var C=window.AudioContext||window.webkitAudioContext;
    var ctx=this.ctx=new C();
    this.master=ctx.createGain(); this.master.gain.value=.85; this.master.connect(ctx.destination);
    this.delay=ctx.createDelay(.5); this.delay.delayTime.value=.17;
    var fb=ctx.createGain(); fb.gain.value=.3;
    var fbp=ctx.createBiquadFilter(); fbp.type='lowpass'; fbp.frequency.value=1500;
    this.delay.connect(fbp); fbp.connect(fb); fb.connect(this.delay);
    var wet=ctx.createGain(); wet.gain.value=.16; this.delay.connect(wet); wet.connect(this.master);
    var send=ctx.createGain(); send.gain.value=.4;
    this.mGain=ctx.createGain(); this.mGain.gain.value=0;
    var shaper=ctx.createWaveShaper();
    var curve=new Float32Array(1024);
    for(var i=0;i<1024;i++){var x=i/512-1; curve[i]=Math.tanh(1.6*x);}
    shaper.curve=curve; shaper.oversample='2x';
    var lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3200;
    this.mGain.connect(shaper); shaper.connect(lp); lp.connect(this.master);
    this.mGain.connect(send); send.connect(this.delay);
    var nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate), nd=nb.getChannelData(0);
    for(var i=0;i<nd.length;i++) nd[i]=(Math.random()*2-1)*.5;
    this.noiseBuf=nb;
    var cb=ctx.createBuffer(1,ctx.sampleRate*2.5,ctx.sampleRate), cd=cb.getChannelData(0);
    for(var i=0;i<cd.length;i++) cd[i]=(Math.random()*2-1)*.015;
    for(var p=0;p<26;p++){
      var pos=Math.floor(Math.random()*cd.length), amp=.2+Math.random()*.55;
      for(var j=0;j<44 && pos+j<cd.length;j++)
        cd[pos+j]+=amp*Math.exp(-j/5)*(Math.random()*2-1);
    }
    var src=ctx.createBufferSource(); src.buffer=cb; src.loop=true;
    var hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=420;
    var lp2=ctx.createBiquadFilter(); lp2.type='lowpass'; lp2.frequency.value=6500;
    this.crackleGain=ctx.createGain(); this.crackleGain.gain.value=0;
    src.connect(hp); hp.connect(lp2); lp2.connect(this.crackleGain); this.crackleGain.connect(this.master);
    src.start();
    this.humG=ctx.createGain(); this.humG.gain.value=0;
    var hum=ctx.createOscillator(); hum.type='sine'; hum.frequency.value=46;
    hum.connect(this.humG); this.humG.connect(this.master); hum.start();
    this.lfo=ctx.createOscillator(); this.lfo.frequency.value=5.2;
    this.lfoGain=ctx.createGain(); this.lfoGain.gain.value=8;
    this.lfo.connect(this.lfoGain); this.lfo.start();
  },
  burst:function(t,obj){
    if(!this.ctx) return;
    var cfg = obj || {};
    var dur=cfg.dur||.05, f=cfg.f||1000, type=cfg.type||'bandpass', vol=cfg.vol||.2;
    var ctx=this.ctx, s=ctx.createBufferSource(); s.buffer=this.noiseBuf;
    var flt=ctx.createBiquadFilter(); flt.type=type; flt.frequency.value=f;
    var g=ctx.createGain();
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    s.connect(flt); flt.connect(g); g.connect(this.master);
    s.start(t); s.stop(t+dur+.05);
  },
  ratchet:function(t){ for(var i=0;i<4;i++) this.burst(t+i*.13,{dur:.045,f:1100,vol:.22}); },
  thump:function(t,vol){ this.burst(t,{dur:.14,f:280,type:'lowpass',vol:vol||.55}); },
  click:function(t){ this.burst(t,{dur:.03,f:2400,type:'highpass',vol:.12}); },
  voice:function(m,t,d){
    var ctx=this.ctx, f=440*Math.pow(2,(m-69)/12);
    var g=ctx.createGain(); g.connect(this.tGain);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.4,t+.02);
    g.gain.setTargetAtTime(.0001, t+d*.55, Math.max(d*.16,.06));
    var o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=f;
    o.detune.value=Math.random()*8-4;
    this.lfoGain.connect(o.detune);
    o.connect(g); o.start(t); o.stop(t+d+.5);
    var g2=ctx.createGain(); g2.connect(this.tGain);
    g2.gain.setValueAtTime(.0001,t);
    g2.gain.exponentialRampToValueAtTime(.1,t+.03);
    g2.gain.setTargetAtTime(.0001, t+d*.5, Math.max(d*.14,.05));
    var o2=ctx.createOscillator(); o2.type='sine'; o2.frequency.value=f/2;
    this.lfoGain.connect(o2.detune);
    o2.connect(g2); o2.start(t); o2.stop(t+d+.5);
  },
  beginTrack:function(t){
    var tr=TRACKS[S.platter];
    if (!tr) return;
    var tg=this.ctx.createGain(); tg.connect(this.mGain);
    tg.gain.setValueAtTime(.0001,Math.max(.01,t-.05));
    tg.gain.linearRampToValueAtTime(1,t+.35);
    this.tGain=tg;
    
    if (tr.type === 'stream') {
      var audio = new Audio();
      audio.src = tr.url;
      audio.loop = true;
      try {
        audio.crossOrigin = 'anonymous';
        var src = this.ctx.createMediaElementSource(audio);
        src.connect(tg);
        this.srcNode = {kind: 'stream', src: src, audio: audio};
      } catch(e) {
        this.srcNode = {kind: 'stream-direct', audio: audio};
      }
      var p = audio.play();
      if (p && p.catch) p.catch(function(){});
    } else if (tr.type === 'audio' && tr.buffer) {
      var src=this.ctx.createBufferSource();
      src.buffer=tr.buffer; src.loop=true; src.connect(tg); src.start(t);
      this.srcNode={kind:'buffer', src:src};
    } else if (tr.type === 'synth') {
      if (tr.notes && tr.notes.length > 0) {
        this.ni=0; this.next=t;
        this.fill();
        this.timer=setInterval(function(){AudioSys.fill();},80);
      }
      this.srcNode = {kind:'synth'};
    }
  },
  stopMusic:function(){
    clearInterval(this.timer); this.timer=null;
    if(!this.ctx) return;
    var now=this.ctx.currentTime;
    if(this.tGain){ this.tGain.gain.setTargetAtTime(0,now,.07); this.tGain=null; }
    if(this.srcNode){
      var n = this.srcNode;
      this.srcNode = null;
      try {
        if (n.kind === 'stream' || n.kind === 'stream-direct') {
          n.audio.pause();
        } else if (n.kind === 'buffer') {
          n.src.stop(now + .4);
        }
      } catch(e) {}
    }
  },
  start:function(){
    this.ensure();
    var now=this.ctx.currentTime+.02;
    this.ratchet(now);
    this.thump(now+.98);
    this.crackleGain.gain.setTargetAtTime(.5, now+.3, .25);
    this.humG.gain.setTargetAtTime(.022, now+.2, .2);
    var g=this.mGain.gain;
    g.cancelScheduledValues(now); g.setValueAtTime(0,now);
    g.linearRampToValueAtTime(.95, now+1.1);
    this.stopMusic();
    this.beginTrack(now+1.05);
  },
  fill:function(){
    var tr=TRACKS[S.platter]; if(!tr || tr.type!=='synth') return;
    if (!tr.notes || tr.notes.length === 0) return;
    var spb=tr.spb*1.22;
    while(this.next < this.ctx.currentTime+.35){
      var nt=tr.notes[this.ni], dur=nt[1]/spb;
      if(nt[0]!=null) this.voice(nt[0],this.next,dur);
      this.next+=dur;
      this.ni=(this.ni+1)%tr.notes.length;
    }
  },
  swapTo:async function(){
    if(!this.ctx) return;
    await decodeSavedIfNeeded();
    var now=this.ctx.currentTime;
    this.click(now);
    this.thump(now+.85,.5);
    this.stopMusic();
    this.beginTrack(now+.95);
  },
  stop:function(){
    this.stopMusic();
    if(!this.ctx) return;
    var now=this.ctx.currentTime;
    this.mGain.gain.setTargetAtTime(0,now,.09);
    this.crackleGain.gain.setTargetAtTime(0,now,.15);
    this.humG.gain.setTargetAtTime(0,now,.12);
    this.click(now+.05);
  }
};

var noteTimer=null;
function spawnNote(){
  var el=document.createElement('span');
  el.className='note';
  el.textContent=['♪','♫','♬','♩'][Math.floor(Math.random()*4)];
  el.style.left=(46+Math.random()*10)+'%';
  el.style.top=(36+Math.random()*9)+'%';
  el.style.fontSize=(15+Math.random()*13)+'px';
  el.style.setProperty('--dx',(Math.random()*110-55)+'px');
  el.style.setProperty('--rot',(Math.random()*40-20)+'deg');
  el.style.animationDuration=(2.2+Math.random()*1.4)+'s';
  notesBox.appendChild(el);
  el.addEventListener('animationend',function(){el.remove();});
}

var savedDecoded = false;
async function decodeSavedIfNeeded() {
  if (savedDecoded || !AudioSys.ctx) return;
  savedDecoded = true;
  var saved = await DB.getAll();
  for (var i = 0; i < saved.length; i++) {
    var item = saved[i];
    for (var j = 0; j < TRACKS.length; j++) {
      if (TRACKS[j].dbId === item.id && TRACKS[j].type === 'pending') {
        try {
          var buf = await AudioSys.ctx.decodeAudioData(item.buffer.slice(0));
          TRACKS[j].type = 'audio';
          TRACKS[j].buffer = buf;
        } catch(e) {}
        break;
      }
    }
  }
  renderShelf();
}

async function setPlaying(on){
  S.playing=on;
  document.body.classList.toggle('playing',on);
  gram.setAttribute('aria-pressed',on);
  
  setMetaTheme(on ? '#8a6226' : '#1b0e08');
  
  if(on){
    AudioSys.ensure();
    await decodeSavedIfNeeded();
    AudioSys.start();
    S.target=5.2;
    noteTimer=setInterval(spawnNote,600);
  }else{
    AudioSys.stop();
    S.target=0;
    clearInterval(noteTimer);
  }
}

gram.addEventListener('click',function(){setPlaying(!S.playing);});
gram.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); setPlaying(!S.playing); }
});
document.addEventListener('keydown',function(e){
  if(e.code==='Space' && !e.target.closest('button')){ e.preventDefault(); setPlaying(!S.playing); }
});

/* ═══ بارگذاری آهنگ‌های ذخیره‌شده از IDB ═══ */
(async function() {
  await DB.init();
  var saved = await DB.getAll();
  
  // آهنگ‌های ذخیره شده را در اسلات‌های خالی ۸ تای اول قرار بده
  saved.forEach(function(item) {
    var idx = TRACKS.length;
    TRACKS.push({type:'pending', name:item.name, lines:item.lines, dbId:item.id});
    
    // پیدا کردن اولین اسلات خالی در ۸ تای اول
    var slotIdx = -1;
    for (var i = 0; i < 8 && i < S.slots.length; i++) {
      if (S.slots[i] === null) { slotIdx = i; break; }
    }
    
    if (slotIdx !== -1) {
      S.slots[slotIdx] = idx;
    } else {
      // اگر اسلات خالی نبود، به انتها اضافه کن (نمایش داده نمیشه)
      S.slots.push(idx);
    }
  });
  
  renderShelf();
})();

(function() {
  var BIRTHDAY_TEXT = "تولدت مبارک دوست عزیزم! امروز روز توست، روزی که دنیا با آمدنت زیباتر شد. آرزو می‌کنم سال پیش رو پر از شادی، سلامتی و موفقیت باشد. همیشه در قلب من جای داری. با عشق و احترام.";
  var ROMANTIC_TEXT = "عشقم، تولدت مبارک! تو بهترین هدیه‌ای هستی که زندگی به من داده. هر نفس کنار تو، تولدی دوباره است. آرزو می‌کنم تا ابد در آغوشت باشم و هر لحظه را با تو جشن بگیرم. بی‌نهایت دوستت دارم.";
  var BIRTHDAY_SIGN = "دوستت";
  var ROMANTIC_SIGN = "عاشقت ❤️";

  var icon = document.getElementById('letterIcon');
  var overlay = document.getElementById('letterOverlay');
  var closeBtn = document.getElementById('letterClose');
  var title = document.getElementById('letterTitle');
  var text = document.getElementById('letterText');
  var sign = document.getElementById('letterSign');

  var clickTimes = [];
  var openTimeout = null;
  var currentType = null;

  function openLetter(type) {
    currentType = type;
    if (type === 'romantic') {
      title.textContent = "نامه‌ای عاشقانه برای تو";
      text.textContent = ROMANTIC_TEXT;
      sign.textContent = "— " + ROMANTIC_SIGN;
    } else {
      title.textContent = "تولدت مبارک!";
      text.textContent = BIRTHDAY_TEXT;
      sign.textContent = "— " + BIRTHDAY_SIGN;
    }
    overlay.classList.add('open');
    icon.classList.remove('has-unread');
  }

  function closeLetter() {
    overlay.classList.remove('open');
  }

  icon.addEventListener('click', function() {
    var now = Date.now();
    clickTimes = clickTimes.filter(function(t) { return now - t < 2000; });
    clickTimes.push(now);

    if (clickTimes.length >= 7) {
      if (openTimeout) { clearTimeout(openTimeout); openTimeout = null; }
      clickTimes = [];
      openLetter('romantic');
    } else {
      if (openTimeout) clearTimeout(openTimeout);
      openTimeout = setTimeout(function() {
        if (clickTimes.length < 7) {
          openLetter('birthday');
        }
        openTimeout = null;
      }, 350);
    }
  });

  icon.addEventListener('keydown', function(e) {
    if (e.code === 'Enter' || e.code === 'Space') {
      e.preventDefault();
      icon.click();
    }
  });

  closeBtn.addEventListener('click', closeLetter);
})();
</script>
