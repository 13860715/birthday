<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  color:#e8e2f8;
  overflow:hidden;
  font-family:"Vazirmatn",system-ui,sans-serif;
  background:
    radial-gradient(1100px 620px at 76% 16%, rgba(109,40,217,.16), transparent 62%),
    radial-gradient(950px 580px at 16% 78%, rgba(76,29,149,.20), transparent 62%),
    radial-gradient(720px 480px at 86% 82%, rgba(139,92,246,.08), transparent 55%),
    radial-gradient(1500px 1000px at 50% 42%, #0d0716 0%, #070310 55%, #020106 100%);
  background-color:#020106;
}
.app{height:100dvh;display:flex;flex-direction:column;position:relative;z-index:1;}

.loader{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(900px 600px at 50% 40%, rgba(76,29,149,.25), transparent 70%),
    #020106;
  transition:opacity .7s ease;
}
.loader.is-hidden{opacity:0;pointer-events:none;}
.loader span{
  font-size:clamp(20px,5vw,34px);
  color:#cfc6ee;
  font-weight:300;
  text-align:center;
  padding:0 20px;
  animation:loaderPulse 1.8s ease-in-out infinite;
}
@keyframes loaderPulse{0%,100%{opacity:.5}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.loader span{animation:none;opacity:1}}

@media (max-width:640px){
  body{
    background:
      radial-gradient(85vmax 60vmax at 78% 8%, rgba(109,40,217,.09), transparent 60%),
      radial-gradient(75vmax 55vmax at 10% 88%, rgba(76,29,149,.11), transparent 60%),
      radial-gradient(95vmax 75vmax at 50% 45%, #070310 0%, #040208 55%, #010103 100%);
    background-color:#010103;
  }
}

.home{
  height:100dvh;
  display:flex;flex-direction:column;
  overflow:hidden;position:relative;
  padding-bottom:calc(clamp(10px,2.2vh,24px) + env(safe-area-inset-bottom,0px));
}
.home__lead{
  flex:0 0 auto;
  margin:0 auto;max-width:640px;
  padding:clamp(12px,2.2vh,26px) 20px 0;
  font-size:clamp(12.5px,1.4vh + 4px,15.5px);
  line-height:1.8;
  color:#cfc6ee;text-align:center;font-weight:300;
  text-shadow:0 2px 20px rgba(0,0,0,.5);
  user-select:none;-webkit-user-select:none;
}
.home__lead.is-anim{animation:leadIn .6s ease;}
@keyframes leadIn{
  from{opacity:0;transform:translateY(8px);}
  to{opacity:1;transform:translateY(0);}
}
.home > .scene{flex:1 1 auto;min-height:0;position:relative;}
.home > .player{flex:0 0 auto;}
.home__toast{
  position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 112px);left:50%;
  transform:translateX(-50%) translateY(12px);
  z-index:40;
  padding:10px 20px;border-radius:99px;
  background:rgba(30,20,50,.55);
  border:1px solid rgba(167,139,250,.35);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:#efeaff;font-size:13px;font-weight:500;
  box-shadow:0 8px 24px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12);
  opacity:0;pointer-events:none;white-space:nowrap;
  transition:opacity .35s ease,transform .35s ease;
}
.home__toast.is-visible{opacity:1;transform:translateX(-50%) translateY(0);}

.galaxy{
  position:fixed;inset:0;z-index:-1;
  width:100vw;height:100vh;display:block;
  pointer-events:none;
}

.scene{position:relative;width:100%;height:100%;}
.scene canvas{display:block;cursor:grab;touch-action:none;}
.scene canvas:active{cursor:grabbing;}

.player{
  display:flex;align-items:center;gap:14px;
  width:min(640px,94vw);
  margin:0 auto;
  padding:12px 18px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.06);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 14px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12);
}
.player__play{
  flex:none;width:52px;height:52px;border-radius:50%;cursor:pointer;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.08);
  display:grid;place-items:center;
  transition:background .25s ease,transform .15s ease;
}
.player__play svg{width:22px;height:22px;fill:#efeaff;}
.player__play:hover{background:rgba(255,255,255,.16);}
.player__play:active{transform:scale(.94);}
.player__play.is-playing{background:rgba(139,92,246,.35);border-color:rgba(167,139,250,.5);}
.player__play:focus-visible{outline:2px solid #a78bfa;outline-offset:3px;}
.player__ic--pause{display:none;}
.player__play.is-playing .player__ic--pause{display:block;}
.player__play.is-playing .player__ic--play{display:none;}
.player__main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
.player__song{display:flex;align-items:baseline;gap:6px;min-width:0;}
.player__title{font-size:13.5px;font-weight:600;color:#efeaff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player__dot{color:rgba(200,188,240,.5);}
.player__artist{font-size:12px;color:#a99cd6;white-space:nowrap;}
.player__seekrow{display:flex;align-items:center;gap:8px;direction:ltr;}
.player__time{font-size:11px;color:#a99cd6;min-width:32px;text-align:center;font-variant-numeric:tabular-nums;}
.player__seek{position:relative;flex:1;height:22px;cursor:pointer;touch-action:none;}
.player__seek:focus-visible{outline:2px solid #a78bfa;outline-offset:3px;}
.player__track{position:absolute;top:50%;left:0;right:0;height:4px;transform:translateY(-50%);border-radius:99px;background:rgba(255,255,255,.14);}
.player__fill{position:absolute;top:0;bottom:0;left:0;width:0%;border-radius:99px;background:linear-gradient(90deg,#7c3aed,#a78bfa,#c4b5fd);box-shadow:0 0 10px rgba(139,92,246,.55);transition:width .12s linear;}
.player__thumb{position:absolute;top:50%;left:0%;width:13px;height:13px;border-radius:50%;transform:translate(-50%,-50%);background:#f4f1ff;border:2px solid rgba(167,139,250,.9);box-shadow:0 0 0 4px rgba(139,92,246,.18);transition:left .12s linear;}
.player__seek.drag .player__fill,.player__seek.drag .player__thumb{transition:none;}
@media (max-width:560px){
  .player{gap:10px;padding:10px 14px;}
  .player__play{width:46px;height:46px;}
  .player__title{font-size:12.5px;}
  .player__artist{font-size:11px;}
}
</style>

<body>
<div class="loader" id="loader"><span>تولد مبارک ماه آسمونی</span></div>
<main class="app">
  <div class="home">
    <canvas class="galaxy" id="galaxyCanvas"></canvas>
    <p class="home__lead" id="lead"></p>
    <div class="scene" id="scene"></div>
    <section class="player">
      <button class="player__play" id="playBtn" type="button" aria-label="پخش آهنگ">
        <svg class="player__ic player__ic--play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="player__ic player__ic--pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <div class="player__main">
        <div class="player__song">
          <span class="player__title">هر جا که باشی</span>

               aria-valuemin="0" aria-valuemax="206" aria-valuenow="0">

  </div>
</main>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'RoomEnvironment.js';

/* ===== utils ===== */
const FA='۰۱۲۳۴۵۶۷۸۹';
const fa=s=>String(s).replace(/\d/g,d=>FA[d]);
const faTime=t=>{const m=Math.floor(t/60),s=Math.floor(t%60);return fa(m+':'+String(s).padStart(2,'0'));};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ===== events ===== */
const bus=new EventTarget();
const emit=(type,detail)=>bus.dispatchEvent(new CustomEvent(type,{detail}));
const on=(type,handler)=>{const listener=e=>handler(e.detail);bus.addEventListener(type,listener);return ()=>bus.removeEventListener(type,listener);};

/* ===== galaxy shared textures ===== */
function starTexture(){
  const cv=document.createElement('canvas');cv.width=cv.height=64;
  const x=cv.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.35,'rgba(255,255,255,0.7)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(cv);
}
function nebulaTexture(inner,mid){
  const cv=document.createElement('canvas');cv.width=cv.height=256;
  const x=cv.getContext('2d');
  const g=x.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0,inner);g.addColorStop(0.55,mid);g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;x.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(cv);
}
function glowTexture(inner,mid){
  const cv=document.createElement('canvas');cv.width=cv.height=256;
  const x=cv.getContext('2d');
  const g=x.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0,inner);g.addColorStop(0.3,mid);g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;x.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(cv);
}
const STAR_COLORS=[
  [0x9bb0ff,0.07],[0xc8d5ff,0.12],[0xf8f7ff,0.24],[0xfff4e8,0.22],
  [0xffe9c4,0.15],[0xffc98f,0.11],[0xff8f6b,0.06],[0xff6b52,0.03],
];
function pickStarColor(){
  let r=Math.random(),acc=0;
  for(const [c,w] of STAR_COLORS){acc+=w;if(r<=acc)return new THREE.Color(c);}
  return new THREE.Color(0xffffff);
}

/* ===== starfield ===== */
function starLayer(count,rMin,rMax,size,opacity,tex){
  const pos=new Float32Array(count*3);
  const col=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const r=rMin+Math.random()*(rMax-rMin);
    const u=Math.random()*2-1;
    const th=Math.random()*Math.PI*2;
    const s=Math.sqrt(1-u*u);
    pos[i*3]=r*s*Math.cos(th);
    pos[i*3+1]=r*u;
    pos[i*3+2]=r*s*Math.sin(th);
    const c=pickStarColor();
    const b=0.5+Math.random()*0.5;
    col[i*3]=c.r*b;col[i*3+1]=c.g*b;col[i*3+2]=c.b*b;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const m=new THREE.PointsMaterial({size,sizeAttenuation:true,map:tex,vertexColors:true,transparent:true,opacity,depthWrite:false,blending:THREE.AdditiveBlending});
  return new THREE.Points(g,m);
}
function createStarfield(scene, q=1){
  const tex=starTexture();
  scene.add(starLayer(Math.round(1000*q),120,280,1.0,0.7,tex));
  scene.add(starLayer(Math.round(400*q),100,240,1.6,0.85,tex));
  scene.add(starLayer(Math.round(140*q),90,200,2.6,0.95,tex));
  scene.add(starLayer(Math.round(40*q),80,180,4.0,1.0,tex));
  const all=[
    ['rgba(255,120,120,0.5)','rgba(180,40,60,0.2)'],
    ['rgba(120,160,255,0.45)','rgba(40,70,180,0.18)'],
    ['rgba(120,230,210,0.4)','rgba(30,140,130,0.16)'],
  ];
  const nebs=q<1?all.slice(0,2):all;
  for(let i=0;i<nebs.length;i++){
    const [inner,mid]=nebs[i];
    const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:nebulaTexture(inner,mid),transparent:true,opacity:0.4,depthWrite:false,blending:THREE.AdditiveBlending}));
    const r=140+Math.random()*80;
    const u=Math.random()*1.2-0.6;
    const th=Math.random()*Math.PI*2;
    const s=Math.sqrt(1-u*u);
    spr.position.set(r*s*Math.cos(th),r*u,r*s*Math.sin(th));
    const sc=40+Math.random()*50;
    spr.scale.set(sc,sc,1);
    scene.add(spr);
  }
}

/* ===== milkyway ===== */
function createMilkyWay(scene, q=1){
  const group=new THREE.Group();
  const tex=starTexture();
  const R=150;
  const count=Math.round(2000*q);
  const pos=new Float32Array(count*3);
  const col=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const b=(Math.random()+Math.random()+Math.random()-1.5)*0.30;
    const r=R*(0.85+Math.random()*0.3);
    pos[i*3]=r*Math.cos(b)*Math.cos(a);
    pos[i*3+1]=r*Math.sin(b);
    pos[i*3+2]=r*Math.cos(b)*Math.sin(a);
    const c=new THREE.Color().setHSL(0.07+Math.random()*0.06,0.35,0.55+Math.random()*0.35);
    const br=0.35+Math.random()*0.65;
    col[i*3]=c.r*br;col[i*3+1]=c.g*br;col[i*3+2]=c.b*br;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const m=new THREE.PointsMaterial({size:1.1,sizeAttenuation:true,map:tex,vertexColors:true,transparent:true,opacity:0.8,depthWrite:false,blending:THREE.AdditiveBlending});
  group.add(new THREE.Points(g,m));
  const haze=glowTexture('rgba(255,240,220,0.8)','rgba(255,220,180,0.3)');
  const hazeCount=Math.round(6*q);
  for(let i=0;i<hazeCount;i++){
    const a=Math.random()*Math.PI*2;
    const r=R*(0.9+Math.random()*0.2);
    const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:haze,color:0xfff0d8,transparent:true,opacity:0.05+Math.random()*0.05,depthWrite:false,blending:THREE.AdditiveBlending}));
    spr.position.set(r*Math.cos(a),(Math.random()-0.5)*10,r*Math.sin(a));
    const sc=60+Math.random()*60;
    spr.scale.set(sc,sc,1);
    group.add(spr);
  }
  group.rotation.set(0.45,0.2,0.25);
  scene.add(group);
  return group;
}

/* ===== solar system ===== */
function makeCanvas(w,h){const cv=document.createElement('canvas');cv.width=w;cv.height=h;return [cv,cv.getContext('2d')];}
function asTexture(cv){const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;return t;}
function sunTexture(c1,c2,c3){
  const [cv,x]=makeCanvas(512,256);
  const g=x.createLinearGradient(0,0,0,256);
  g.addColorStop(0,c1);g.addColorStop(0.5,c2);g.addColorStop(1,c3);
  x.fillStyle=g;x.fillRect(0,0,512,256);
  for(let i=0;i<520;i++){
    const px=Math.random()*512,py=Math.random()*256,r=2+Math.random()*9;
    x.fillStyle=Math.random()>0.5?'rgba(255,245,200,0.30)':'rgba(255,140,40,0.22)';
    x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.fill();
  }
  return asTexture(cv);
}
function rockyTexture(base,dark,light,craters,poles){
  const [cv,x]=makeCanvas(512,256);
  x.fillStyle=base;x.fillRect(0,0,512,256);
  for(let i=0;i<26;i++){
    const px=Math.random()*512,py=Math.random()*256,r=20+Math.random()*50;
    x.fillStyle=Math.random()>0.5?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.06)';
    x.beginPath();x.ellipse(px,py,r,r*(0.5+Math.random()*0.5),Math.random()*Math.PI,0,Math.PI*2);x.fill();
  }
  for(let i=0;i<craters;i++){
    const px=Math.random()*512,py=Math.random()*256,r=2+Math.random()*16;
    x.fillStyle=Math.random()>0.5?light:dark;
    x.beginPath();x.ellipse(px,py,r,r*(0.5+Math.random()*0.5),Math.random()*Math.PI,0,Math.PI*2);x.fill();
  }
  if(poles){x.fillStyle='rgba(255,255,255,0.85)';x.fillRect(0,0,512,13);x.fillRect(0,243,512,13);}
  return asTexture(cv);
}
function bandedTexture(stops,turb,spots){
  const [cv,x]=makeCanvas(512,256);
  const g=x.createLinearGradient(0,0,0,256);
  for(const [p,c] of stops)g.addColorStop(p,c);
  x.fillStyle=g;x.fillRect(0,0,512,256);
  for(let i=0;i<turb;i++){
    const y=Math.random()*256,h=1+Math.random()*5,wob=Math.random()*0.12;
    x.fillStyle=Math.random()>0.5?`rgba(255,255,255,${wob})`:`rgba(0,0,0,${wob})`;
    x.fillRect(0,y,512,h);
  }
  if(spots)for(const s of spots){
    x.fillStyle=s.color;
    x.beginPath();x.ellipse(s.x,s.y,s.rx,s.ry,0,0,Math.PI*2);x.fill();
    x.strokeStyle='rgba(255,255,255,0.15)';x.lineWidth=2;
    x.beginPath();x.ellipse(s.x,s.y,s.rx,s.ry,0,0,Math.PI*2);x.stroke();
  }
  return asTexture(cv);
}
function earthTexture(ocean,land1,land2,ice){
  const [cv,x]=makeCanvas(512,256);
  x.fillStyle=ocean;x.fillRect(0,0,512,256);
  for(let i=0;i<30;i++){
    const px=Math.random()*512,py=Math.random()*256,r=10+Math.random()*40;
    x.fillStyle='rgba(255,255,255,0.04)';
    x.beginPath();x.ellipse(px,py,r,r*0.6,Math.random()*Math.PI,0,Math.PI*2);x.fill();
  }
  for(let i=0;i<48;i++){
    const px=Math.random()*512,py=24+Math.random()*208,r=6+Math.random()*30;
    x.fillStyle=Math.random()>0.45?land1:land2;
    x.beginPath();x.ellipse(px,py,r,r*(0.4+Math.random()*0.6),Math.random()*Math.PI,0,Math.PI*2);x.fill();
  }
  x.fillStyle=ice;x.fillRect(0,0,512,15);x.fillRect(0,241,512,15);
  for(let i=0;i<80;i++){
    const px=Math.random()*512,py=Math.random()*256,r=5+Math.random()*24;
    x.fillStyle=`rgba(255,255,255,${0.12+Math.random()*0.22})`;
    x.beginPath();x.ellipse(px,py,r,r*0.35,Math.random()*Math.PI,0,Math.PI*2);x.fill();
  }
  return asTexture(cv);
}
function ringTexture(stops){
  const [cv,x]=makeCanvas(256,16);
  const g=x.createLinearGradient(0,0,256,0);
  for(const [p,c] of stops)g.addColorStop(p,c);
  x.fillStyle=g;x.fillRect(0,0,256,16);
  return asTexture(cv);
}
function buildPlanet(spec,detail=1){
  const seg=detail<1?18:24;
  let texture;
  switch(spec.kind){
    case 'earth':texture=earthTexture(spec.ocean,spec.land1,spec.land2,spec.ice);break;
    case 'gas':texture=bandedTexture(spec.stops,spec.turb,spec.spots);break;
    default:texture=rockyTexture(spec.base,spec.dark,spec.light,spec.craters||0,spec.poles||false);
  }
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(spec.radius,seg,seg),
    new THREE.MeshStandardMaterial({map:texture,roughness:0.85,metalness:0}));
  const tiltGroup=new THREE.Group();
  if(spec.tilt)tiltGroup.rotation.z=spec.tilt;
  tiltGroup.add(mesh);
  if(spec.atmosphere){
    const atmo=new THREE.Mesh(new THREE.SphereGeometry(spec.radius*1.09,seg,seg),
      new THREE.MeshBasicMaterial({color:spec.atmosphere,transparent:true,opacity:0.16,side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false}));
    tiltGroup.add(atmo);
  }
  tiltGroup.position.x=spec.distance;
  const pivot=new THREE.Group();
  pivot.add(tiltGroup);
  pivot.rotation.y=Math.random()*Math.PI*2;
  if(spec.ring){
    const inner=spec.radius*1.35,outer=spec.radius*(spec.ring.outerScale||2.3);
    const rg=new THREE.RingGeometry(inner,outer,(detail<1?64:96),1);
    const posAttr=rg.attributes.position,uv=rg.attributes.uv;
    for(let i=0;i<posAttr.count;i++){
      const px=posAttr.getX(i),py=posAttr.getY(i);
      const rr=Math.sqrt(px*px+py*py);

    ringMesh.rotation.x=Math.PI/2;

function createSolarSystem(scene,cfg,detail=1){
  const group=new THREE.Group();
  group.position.copy(cfg.position);
  group.scale.setScalar(cfg.scale);
  const toCam=cfg.position.clone().multiplyScalar(-1).normalize();
  group.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),toCam);
  group.rotateX(0.4);
  const sunSeg=detail<1?24:32;
  const sun=new THREE.Mesh(new THREE.SphereGeometry(cfg.sun.radius,sunSeg,sunSeg),
    new THREE.MeshBasicMaterial({map:sunTexture(cfg.sun.c1,cfg.sun.c2,cfg.sun.c3)}));
  group.add(sun);
  const corona=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTexture(cfg.sun.glowInner,cfg.sun.glowMid),transparent:true,opacity:0.85,depthWrite:false,blending:THREE.AdditiveBlending}));
  corona.scale.set(cfg.sun.radius*6,cfg.sun.radius*6,1);
  group.add(corona);
  const sunLight=new THREE.PointLight(cfg.sun.lightColor,8,45,1);
  group.add(sunLight);
  const planets=[];
  function addOrbitLine(radius){
    const n=detail<1?48:64;
    const pts=[];
    for(let i=0;i<=n;i++){const a=i/n*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*radius,0,Math.sin(a)*radius));}
    group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({color:cfg.orbitColor||0x8a7ab5,transparent:true,opacity:0.14})));
  }
  for(const spec of cfg.planets){
    addOrbitLine(spec.distance);
    const p=buildPlanet(spec,detail);
    group.add(p.pivot);
    planets.push(p);
  }
  scene.add(group);
  function update(dt){
    sun.rotation.y+=0.03*dt;
    for(const p of planets){
      p.pivot.rotation.y+=p.orbitSpeed*dt;
      p.mesh.rotation.y+=p.rotationSpeed*dt;
    }
  }
  return {group,update};
}

function initGalaxy(canvas){
  const isMobile=innerWidth<640;
  const quality=isMobile?0.5:1;
  const renderer=new THREE.WebGLRenderer({canvas,antialias:!isMobile,alpha:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(isMobile?Math.min(devicePixelRatio,1.25):Math.min(devicePixelRatio,2));
  renderer.setClearColor(0x000000,0);
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(48,1,0.1,600);
  scene.add(new THREE.AmbientLight(0x666688,0.4));
  createStarfield(scene,quality);
  createMilkyWay(scene,quality);
  const systems=[
    createSolarSystem(scene,SYSTEM_OURS,quality),
    createSolarSystem(scene,SYSTEM_BLUE,quality),
  ];
  const orbit={az:2.16,taz:2.16};
  let lastInteract=performance.now();
  on('scene:drag',({dx})=>{orbit.taz-=dx*0.003;lastInteract=performance.now();});
  function fit(){
    const w=innerWidth,h=innerHeight;
    renderer.setSize(w,h,false);
    camera.aspect=w/h;camera.updateProjectionMatrix();
  }
  fit();
  addEventListener('resize',fit);
  let last=performance.now();
  function loop(now){
    requestAnimationFrame(loop);
    const dt=Math.min(0.05,(now-last)/1000);last=now;
    if(!reducedMotion&&now-lastInteract>4000)orbit.taz+=dt*0.02;
    orbit.az+=(orbit.taz-orbit.az)*Math.min(1,dt*4);
    camera.position.set(0,2,0);
    camera.lookAt(Math.sin(orbit.az)*100,10.7,Math.cos(orbit.az)*100);
    const step=reducedMotion?0:dt;
    for(const s of systems)s.update(step);
    renderer.render(scene,camera);
  }
  requestAnimationFrame(loop);
}

/* ===== gramophone model ===== */
function taperedTube(curve,tub,rad,r0,r1){
  const fr=curve.computeFrenetFrames(tub,false);
  const pos=[],nor=[],uv=[],idx=[];
  const P=new THREE.Vector3(),N=new THREE.Vector3(),B=new THREE.Vector3();
  for(let i=0;i<=tub;i++){
    const t=i/tub;curve.getPointAt(t,P);
    N.copy(fr.normals[i]);B.copy(fr.binormals[i]);
    const r=r0+(r1-r0)*t;
    for(let j=0;j<=rad;j++){
      const v=j/rad*Math.PI*2,sn=Math.sin(v),cs=-Math.cos(v);
      const nx=cs*N.x+sn*B.x,ny=cs*N.y+sn*B.y,nz=cs*N.z+sn*B.z;
      pos.push(P.x+r*nx,P.y+r*ny,P.z+r*nz);
      nor.push(nx,ny,nz);uv.push(t,j/rad);
    }
  }
  for(let i=0;i<tub;i++)for(let j=0;j<rad;j++){
    const a=(rad+1)*i+j,b=(rad+1)*(i+1)+j,c=b+1,d=a+1;
    idx.push(a,b,d,b,c,d);
  }
  const g=new THREE.BufferGeometry();
  g.setIndex(idx);
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  return g;
}

  const axle=M(new THREE.CylinderGeometry(0.032,0.032,0.2,16),mats.brass);
  axle.rotation.z=Math.PI/2;axle.position.set(1.8,1.3,0.45);gram.add(axle);
  const crank=new THREE.Group();crank.position.set(1.9,1.3,0.45);gram.add(crank);
  const armC=M(new THREE.CylinderGeometry(0.02,0.02,0.26,12),mats.brass);
  armC.position.y=-0.13;crank.add(armC);
  const grip=M(new THREE.CylinderGeometry(0.02,0.02,0.16,12),mats.brass);
  grip.rotation.z=Math.PI/2;grip.position.set(0.08,-0.26,0);crank.add(grip);
  const knob=M(new THREE.SphereGeometry(0.045,16,12),mats.darkWood);
  knob.position.set(0.17,-0.26,0);crank.add(knob);
  const plate=M(new THREE.PlaneGeometry(1.5,0.44),
    new THREE.MeshStandardMaterial({map:plqTex,metalness:0.7,roughness:0.4}));
  plate.position.set(0,1.02,1.455);gram.add(plate);
  return {group:gram,recGrp,armGrp,crank,liftAxis,hornMat:mats.hornMat};
}

/* ===== camera rig ===== */
function createCameraRig(camera,canvas,{target,radius,onDrag}){
  const orbit={th:0.55,ph:1.12,r:radius,tth:0.55,tr:radius,drag:false,lx:0,ly:0};
  let lastInteract=performance.now();
  canvas.addEventListener('pointerdown',e=>{orbit.drag=true;orbit.lx=e.clientX;orbit.ly=e.clientY;
    canvas.setPointerCapture(e.pointerId);lastInteract=performance.now();});
  canvas.addEventListener('pointermove',e=>{
    if(!orbit.drag)return;
    const dx=e.clientX-orbit.lx,dy=e.clientY-orbit.ly;
    orbit.tth-=dx*0.005;
    orbit.lx=e.clientX;orbit.ly=e.clientY;lastInteract=performance.now();
    onDrag&&onDrag({dx,dy});
  });
  const endDrag=e=>{orbit.drag=false;try{canvas.releasePointerCapture(e.pointerId)}catch(_){}};
  canvas.addEventListener('pointerup',endDrag);
  canvas.addEventListener('pointercancel',endDrag);
  return {
    setBaseRadius(r){orbit.tr=r;},
    update(dt,now){
      if(!orbit.drag&&!reducedMotion&&now-lastInteract>4000)orbit.tth+=dt*0.05;
      orbit.th+=(orbit.tth-orbit.th)*Math.min(1,dt*6);
      orbit.r+=(orbit.tr-orbit.r)*Math.min(1,dt*6);
      camera.position.set(
        target.x+orbit.r*Math.sin(orbit.ph)*Math.sin(orbit.th),
        target.y+orbit.r*Math.cos(orbit.ph),
        target.z+orbit.r*Math.sin(orbit.ph)*Math.cos(orbit.th));
      camera.lookAt(target);
    }
  };
}

/* ===== gramophone scene ===== */
function initGramophoneScene(stage){
  const isMobile=innerWidth<640;
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(isMobile?Math.min(devicePixelRatio,1.5):Math.min(devicePixelRatio,2));
  renderer.setClearColor(0x000000,0);
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.12;
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  stage.appendChild(renderer.domElement);
  const scene=new THREE.Scene();
  const pmrem=new THREE.PMREMGenerator(renderer);
  scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
  pmrem.dispose();
  const camera=new THREE.PerspectiveCamera(40,1,0.1,80);
  scene.add(new THREE.HemisphereLight(0x9f8cff,0x140a24,0.55));
  const key=new THREE.DirectionalLight(0xfff0dd,1.55);key.position.set(4,7,5);scene.add(key);
  const fill=new THREE.DirectionalLight(0xbfa8ff,0.4);fill.position.set(-6,3,-2);scene.add(fill);
  const rim=new THREE.PointLight(0x8b5cf6,1.1,0,0);rim.position.set(-2.5,4.5,-5);scene.add(rim);
  const maxAniso=renderer.capabilities.getMaxAnisotropy();
  const mats=createMaterials(maxAniso);
  const rec=createRecordTexture(maxAniso);
  const plq=createPlateTexture();
  document.fonts.ready.then(()=>{rec.redraw();plq.redraw();});
  const gram=createGramophone(mats,rec.texture,plq.texture);
  scene.add(gram.group);
  const target=new THREE.Vector3(0.45,2.3,0);
  const rig=createCameraRig(camera,renderer.domElement,{target,radius:8,
    onDrag:({dx,dy})=>emit('scene:drag',{dx,dy})});
  let phase='idle',windStart=0;
  on('player:state',s=>{phase=s.phase;windStart=s.windStart||0;});
  function fit(){
    const w=stage.clientWidth,h=stage.clientHeight;
    if(!w||!h)return;
    camera.aspect=w/h;camera.updateProjectionMatrix();
    renderer.setSize(w,h);
    const vFov=40*Math.PI/180;
    const aspect=w/h;
    const hFov=2*Math.atan(Math.tan(vFov/2)*aspect);
    const needW=5.0,needH=5.8;
    const rW=(needW/2)/Math.tan(hFov/2);
    const rH=(needH/2)/Math.tan(vFov/2);
    let radius=Math.max(rW,rH)*1.05;
    if(w<640)radius*=1.1;
    rig.setBaseRadius(radius);
  }
  fit();
  if('ResizeObserver' in window)new ResizeObserver(fit).observe(stage);
  let last=performance.now(),spinVel=0,lift=-0.07;
  function loop(now){
    requestAnimationFrame(loop);
    const dt=Math.min(0.05,(now-last)/1000);last=now;
    const playing=phase==='playing';
    spinVel+=((playing?5.6:0)-spinVel)*Math.min(1,dt*2.2);
    gram.recGrp.rotation.y-=spinVel*dt;
    lift+=((playing?0:-0.07)-lift)*Math.min(1,dt*5);
    gram.armGrp.quaternion.setFromAxisAngle(gram.liftAxis,lift);
    if(phase==='winding'){
      const p=clamp((now-windStart)/800,0,1),e=1-Math.pow(1-p,3);
      gram.crank.rotation.x=e*Math.PI*4;
    }
    const et=playing?0.12+0.05*Math.sin(now*0.008):0;
    gram.hornMat.emissiveIntensity+=(et-gram.hornMat.emissiveIntensity)*Math.min(1,dt*4);
    rig.update(dt,now);
    renderer.render(scene,camera);
  }
  requestAnimationFrame(loop);
}

/* ===== audio engine ===== */
function createAudioEngine(){
  let actx=null,master=null,inp=null,crackleG=null;
  function ensure(){
    if(actx)return;
    try{
      actx=new (window.AudioContext||window.webkitAudioContext)();
      inp=actx.createGain();
      const hp=actx.createBiquadFilter();hp.type='highpass';hp.frequency.value=160;
      const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=4600;
      const shp=actx.createWaveShaper();const cur=new Float32Array(256);
      for(let i=0;i<256;i++){const v=i/128-1;cur[i]=Math.tanh(1.6*v);}
      shp.curve=cur;
      master=actx.createGain();master.gain.value=0.9;
      inp.connect(hp);hp.connect(lp);lp.connect(shp);shp.connect(master);
      const conv=actx.createConvolver(),len=Math.floor(actx.sampleRate*1.7),ib=actx.createBuffer(2,len,actx.sampleRate);
      for(let ch=0;ch<2;ch++){const d=ib.getChannelData(ch);
        for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8);}
      conv.buffer=ib;
      const wet=actx.createGain();wet.gain.value=0.28;
      master.connect(actx.destination);master.connect(conv);conv.connect(wet);wet.connect(actx.destination);
      const nb=actx.createBuffer(1,actx.sampleRate*3,actx.sampleRate),nd=nb.getChannelData(0);
      for(let i=0;i<nd.length;i++)nd[i]=(Math.random()*2-1)*0.012;
      for(let s=0;s<150;s++){
        const p0=Math.floor(Math.random()*nd.length),amp=0.25+Math.random()*0.5,l=8+Math.floor(Math.random()*30);
        for(let k=0;k<l&&p0+k<nd.length;k++)nd[p0+k]+=amp*(1-k/l)*(Math.random()*2-1);
      }
      const src=actx.createBufferSource();src.buffer=nb;src.loop=true;
      const chf=actx.createBiquadFilter();chf.type='highpass';chf.frequency.value=1400;
      crackleG=actx.createGain();crackleG.gain.value=0;
      src.connect(chf);chf.connect(crackleG);crackleG.connect(master);
      src.start();
    }catch(e){actx=null;}
  }
  function ratchet(){
    if(!actx)return;
    const t0=actx.currentTime;
    for(let k=0;k<8;k++){
      const o=actx.createOscillator(),g=actx.createGain();
      o.type='square';o.frequency.value=650+Math.random()*250;
      g.gain.setValueAtTime(0.035,t0+k*0.09);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+k*0.09+0.04);
      o.connect(g);g.connect(inp);
      o.start(t0+k*0.09);o.stop(t0+k*0.09+0.06);
    }
  }
  function setCrackle(level){
    if(actx&&crackleG)crackleG.gain.setTargetAtTime(level,actx.currentTime,level>0?0.15:0.08);
  }
  return {
    ensure,
    resume(){if(actx&&actx.state==='suspended')actx.resume();},
    isReady:()=>!!actx,
    ratchet,setCrackle
  };
}

/* ===== player ===== */
function initPlayer(){
  const TRACK={
    url:'https://dls.musics-fa.com/tagdl/downloads/Emo%20Band%20-%20Harja%20Ke%20Bashi%20(320).mp3',
    duration:206
  };
  const playBtn=document.getElementById('playBtn');
  const seek=document.getElementById('seek');
  const fill=document.getElementById('fill');
  const thumb=document.getElementById('thumb');
  const curEl=document.getElementById('curTime');
  const durEl=document.getElementById('durTime');
  durEl.textContent=faTime(TRACK.duration);
  seek.setAttribute('aria-valuemax',TRACK.duration);
  const engine=createAudioEngine();
  const el=new Audio();
  el.preload='metadata';el.volume=0.92;
  el.src=TRACK.url;
  let playing=false,winding=false,windTimer=null,windStart=0;
  const effDur=()=>TRACK.duration;
  const currentPos=()=>isFinite(el.currentTime)?el.currentTime:0;
  const emitState=()=>emit('player:state',{phase:winding?'winding':playing?'playing':'idle',windStart});
  function syncBtn(){
    const on=playing||winding;
    playBtn.classList.toggle('is-playing',on);
    playBtn.setAttribute('aria-pressed',String(on));
    playBtn.setAttribute('aria-label',on?'توقف آهنگ':'پخش آهنگ');
  }
  function startPlayback(){
    winding=false;playing=true;
    el.play().catch(()=>{});
    engine.setCrackle(0.05);
    emitState();
  }
  function pause(){
    if(winding){clearTimeout(windTimer);winding=false;syncBtn();emitState();return;}
    if(!playing)return;
    playing=false;el.pause();
    engine.setCrackle(0);
    syncBtn();emitState();
  }
  function wind(){
    if(winding)return;
    engine.ensure();if(!engine.isReady())return;
    engine.resume();
    winding=true;windStart=performance.now();
    engine.ratchet();
    syncBtn();emitState();
    windTimer=setTimeout(startPlayback,800);
  }
  const toggle=()=>(playing||winding)?pause():wind();
  function seekTo(sec){
    const v=clamp(sec,0,effDur()-0.05);
    try{el.currentTime=v;}catch(_){}
  }
  playBtn.addEventListener('click',toggle);
  let dragging=false,lastShown=-1;
  const fromX=x=>{const r=seek.getBoundingClientRect();seekTo(((x-r.left)/r.width)*effDur());};
  seek.addEventListener('pointerdown',e=>{dragging=true;seek.classList.add('drag');seek.setPointerCapture(e.pointerId);fromX(e.clientX);});
  seek.addEventListener('pointermove',e=>{if(dragging)fromX(e.clientX);});
  const end=e=>{dragging=false;seek.classList.remove('drag');try{seek.releasePointerCapture(e.pointerId)}catch(_){}};
  seek.addEventListener('pointerup',end);
  seek.addEventListener('pointercancel',end);
  seek.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'){seekTo(currentPos()+3);e.preventDefault();}
    if(e.key==='ArrowLeft'){seekTo(currentPos()-3);e.preventDefault();}
  });
  el.addEventListener('ended',()=>{
    playing=false;
    el.pause();
    try{el.currentTime=0;}catch(_){}
    engine.setCrackle(0);
    syncBtn();
    emitState();
  });
  function loop(){
    requestAnimationFrame(loop);
    const local=currentPos(),dur=effDur();
    const pct=dur>0?((Math.min(local,dur)/dur)*100).toFixed(2)+'%':'0%';
    fill.style.width=pct;thumb.style.left=pct;
    const sec=Math.floor(local);
    if(sec!==lastShown){lastShown=sec;curEl.textContent=faTime(local);seek.setAttribute('aria-valuenow',sec);}
  }
  requestAnimationFrame(loop);
}

/* ===== home / bootstrap ===== */
const FRIEND_TEXT='تولدت مبارک دوست عزیزم! امیدوارم این سال جدید پر باشه از خنده، سلامتی و لحظه‌های قشنگ. تو یکی از بهترین آدم‌های زندگی منی و از ته دل برات آرزو می‌کنم به همه‌ی آرزوهای قشنگت برسی. همیشه شاد و سلامت باشی.';
const LOVE_TEXT='تولدت مبارک عشقِ من! از روزی که واردِ زندگی‌ام شدی، همه‌چیز قشنگ‌تر شد. تو دلیلِ خنده‌ها و آرامشِ جانِ منی. از ته دل آرزو می‌کنم به همه‌ی رویاهای قشنگت برسی و بدانی که در هر جا که باشی، قلبِ من کنارِ توست. دوستت دارم.';

function initHome(){
  const lead=document.getElementById('lead');
  const toast=document.getElementById('toast');
  lead.textContent=FRIEND_TEXT;
  initGalaxy(document.getElementById('galaxyCanvas'));
  initGramophoneScene(document.getElementById('scene'));
  initPlayer();
  let clicks=0;
  let secret=false;
  let toastTimer=null;
  function showToast(msg){
    toast.textContent=msg;
    toast.classList.add('is-visible');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>toast.classList.remove('is-visible'),2000);
  }
  lead.addEventListener('click',()=>{
    if(secret)return;
    clicks++;
    if(clicks===5){
      showToast('دو بار دیگه');
    }else if(clicks===6){
      showToast('یک بار دیگه');
    }else if(clicks>=7){
      secret=true;
      clearTimeout(toastTimer);
      toast.classList.remove('is-visible');
      lead.classList.remove('is-anim');
      void lead.offsetWidth;
      lead.textContent=LOVE_TEXT;
      lead.classList.add('is-anim');
    }
  });
}

async function boot(){
  initHome();
  const loader=document.getElementById('loader');
  if(loader){
    await document.fonts.ready;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      loader.classList.add('is-hidden');
      setTimeout(()=>loader.remove(),800);
    }));
  }
}
boot();
